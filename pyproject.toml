[project]
name = "eigen-memory-agent"
version = "0.1.0"
description = "Evaluating a lossy eigen-memory agent that compresses failures into English rules (Gemma 3 4b / Gemma 4 12b, local)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.3.0",
    "openai>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
    "pgvector>=0.2.0",
    "matplotlib>=3.10.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
# scratch/ holds throwaway probes that hit a live Ollama; only tests/ is the suite.
testpaths = ["tests"]
markers = [
    "slow: measures a power curve by simulation; slower than a unit test",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eigen_memory_agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

