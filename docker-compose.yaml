services:
  db:
    image: pgvector/pgvector:pg16
    container_name: memory-db
    # Long runs (6+ h) outlive reboots; without this the container stays down
    # after a crash and the driver dies mid-arm. "unless-stopped" survives a
    # reboot but still honours a deliberate `docker stop`.
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password        # local dev only — not exposed outside Docker
      POSTGRES_DB: memory_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
